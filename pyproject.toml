[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3m-electricaltwin"
version = "0.0.0"
description = "S3M ElectricalTwin — an advisory, read-only AI digital twin for facility electrical infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2,<3",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.pytest.ini_options]
# Repo root (via the root conftest) supports ``import packages.<pkg>``; the
# extra pythonpath entries support the bare ``import canonical_electrical_model``
# and ``import app`` styles used by some tests.
pythonpath = ["packages", "services/electricaltwin-api"]
testpaths = ["packages", "services"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# UP042 (prefer ``enum.StrEnum``) is intentionally disabled: the canonical
# vocabularies are ``str, Enum`` classes with explicit string values equal to
# their names, which is the round-trip contract the enum consumers rely on.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
# Only the repo root and the API service are on the type-check path, so each
# module has a single canonical name (``packages.<pkg>`` and ``app``); adding
# ``packages`` here as well would make mypy see modules under two names.
mypy_path = ".:services/electricaltwin-api"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
# Tests exercise deliberately-invalid inputs and dynamic **kwargs builders and
# use bare imports; they are not type-checked. Source is fully checked.
exclude = ['(^|/)tests/']
