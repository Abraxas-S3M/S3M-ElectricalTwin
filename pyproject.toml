[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3m-electricaltwin"
version = "0.0.0"
description = "S3M ElectricalTwin — advisory, read-only electrical reasoning platform (Work Package 0)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
name = "s3m-electrical-twin"
version = "0.0.0"
description = "S3M ElectricalTwin canonical models (observe-only, pydantic v2)."
name = "canonical-electrical-model"
version = "0.1.0"
description = "Canonical enumerations and value vocabularies for the S3M ElectricalTwin domain model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.pytest.ini_options]
testpaths = ["packages"]
name = "s3m-electricaltwin"
version = "0.0.0"
description = "S3M ElectricalTwin — an advisory, read-only AI digital twin for facility electrical infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2,<3",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
# The project is organised as a collection of first-party packages under
# ``packages/`` and services under ``services/``. It is imported by directory
# from the repository root rather than installed, so no automatic package
# discovery is configured here.
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # Line length is enforced by the formatter, not the linter, so long
    # human-readable advisory strings in constants are permitted.
    "E501",
    # `str, Enum` is used deliberately so enum values serialise as their string
    # form through pydantic and FastAPI; StrEnum is not required here.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ".:services/electricaltwin-api"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = [".", "services/electricaltwin-api"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Emitted by Starlette's TestClient shim; not actionable in application code.
    "ignore:Using `httpx` with `starlette.testclient`",
]
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools]
# This repository uses an explicit, path-based layout rather than an
# installable distribution. Packaging metadata is present for tooling only.
py-modules = []

[tool.pytest.ini_options]
# Put packages/ and the API service on the import path.
pythonpath = ["packages", "services/electricaltwin-api"]
addopts = "--cov=packages --cov=services --cov-report=term-missing"
testpaths = ["packages/tests", "services/electricaltwin-api/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
# Put packages/ and the API service on the type-check path.
mypy_path = "packages:services/electricaltwin-api"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
