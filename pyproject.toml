[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3m-electricaltwin"
version = "0.0.0"
description = "S3M ElectricalTwin — an advisory, read-only AI digital twin for facility electrical infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.pytest.ini_options]
# Repo root (via the root conftest) supports ``import packages.<pkg>``; the
# extra pythonpath entries support the bare ``import canonical_electrical_model``
# and ``import app`` styles used by some tests.
pythonpath = ["packages", "services/electricaltwin-api"]
testpaths = ["packages", "services"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "packages:services/electricaltwin-api"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
